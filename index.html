<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.O.M Cafe 進銷存系統</title>
<style>
body{font-family:"微軟正黑體",sans-serif;background:#F3EFE3;color:#0B2E21;margin:0;padding:0}
header{background:#0B2E21;color:#F3EFE3;padding:16px 24px}
header h1{margin:0;font-size:20px}
.container{max-width:1200px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid #C5A047;border-radius:6px;padding:16px;margin-bottom:16px}
.card h2{margin-top:0;color:#0B2E21;font-size:16px;border-bottom:2px solid #C5A047;padding-bottom:8px}
label{display:block;margin:8px 0 4px;font-size:13px;font-weight:bold}
input,select{width:100%;padding:8px;box-sizing:border-box;border:1px solid #ccc;border-radius:4px;font-size:14px}
button{background:#0B2E21;color:#C5A047;border:none;padding:10px 20px;border-radius:4px;cursor:pointer;margin-top:10px;font-weight:bold;font-size:14px}
button:hover{background:#1D4D3A}
button:disabled{background:#ccc;cursor:not-allowed}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#0B2E21;color:#C5A047}
tr:nth-child(even){background:#F3EFE3}
tr:hover{background:#E8D5A3}
#loginStatus{font-size:13px;margin-top:8px}
.status-success{color:#2E7D32}
.status-error{color:#C62828}
.status-info{color:#1565C0}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:200px}
.note{font-size:12px;color:#6B4A2E;margin-top:8px}
.result-box{background:#f5f5f5;border:1px solid #ddd;padding:12px;border-radius:4px;font-family:monospace;font-size:12px;white-space:pre-wrap;overflow-x:auto;margin-top:10px}
.nav-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.nav-tab{padding:8px 16px;background:#fff;border:1px solid #C5A047;border-radius:4px 4px 0 0;cursor:pointer;font-weight:bold}
.nav-tab.active{background:#0B2E21;color:#C5A047}
.tab-content{display:none}
.tab-content.active{display:block}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:bold}
.badge-success{background:#4CAF50;color:#fff}
.badge-warning{background:#FF9800;color:#fff}
.badge-info{background:#2196F3;color:#fff}
.alert{padding:12px;border-radius:4px;margin-bottom:12px}
.alert-info{background:#E3F2FD;border:1px solid #2196F3;color:#1565C0}
.alert-success{background:#E8F5E9;border:1px solid #4CAF50;color:#2E7D32}
.alert-error{background:#FFEBEE;border:1px solid #F44336;color:#C62828}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.stat-card{background:#fff;border:1px solid #C5A047;border-radius:6px;padding:16px;text-align:center}
.stat-value{font-size:28px;font-weight:bold;color:#0B2E21}
.stat-label{font-size:13px;color:#666;margin-top:4px}
</style>
</head>
<body>
<header><h1>☕ A.O.M Cafe 進銷存系統（線上版）</h1></header>
<div class="container">

<div class="card" id="loginCard">
<h2>🔐 系統登入</h2>
<div class="row">
<div><label>帳號</label><input id="username" placeholder="請輸入帳號"></div>
<div><label>密碼</label><input id="password" type="password" placeholder="請輸入密碼"></div>
</div>
<button onclick="login()" id="loginBtn">登入系統</button>
<div id="loginStatus"></div>
<p class="note">💡 首次啟動可能需等待 20~60 秒（免費方案伺服器冷啟動中，請耐心等候）</p>
</div>

<div id="mainApp" style="display:none;">

<div class="nav-tabs">
<div class="nav-tab active" onclick="switchTab('inventory')">📦 庫存查詢</div>
<div class="nav-tab" onclick="switchTab('receive')">📥 進貨登錄</div>
<div class="nav-tab" onclick="switchTab('issue')">📤 出貨登錄</div>
<div class="nav-tab" onclick="switchTab('reports')">📊 報表輸出</div>
</div>

<div class="tab-content active" id="tab-inventory">
<div class="card">
<h2>📦 即時庫存查詢</h2>
<div class="alert alert-info"><span id="inventoryStatus">點擊「重新整理」載入最新庫存資料</span></div>
<button onclick="loadInventory()" id="loadInvBtn">🔄 重新整理庫存</button>
<table id="inventoryTable">
<thead><tr><th>SKU</th><th>品名</th><th>庫存量 (g)</th><th>批次數</th><th>最舊批次庫齡 (天)</th><th>狀態</th></tr></thead>
<tbody></tbody>
</table>
</div>
</div>

<div class="tab-content" id="tab-receive">
<div class="card">
<h2>📥 進貨登錄（FIFO 自動入帳）</h2>
<div class="row">
<div><label>SKU 編號</label><input id="receiveSkuNo" value="1" type="number"></div>
<div><label>進貨量 (g)</label><input id="receiveQty" value="1000" type="number"></div>
<div><label>單位成本 (NT$/100g)</label><input id="receiveCost" value="200" type="number"></div>
<div><label>供應商</label><input id="receiveSupplier" value="default_supplier" placeholder="可選"></div>
</div>
<button onclick="receiveStock()" id="receiveBtn">✅ 確認進貨</button>
<div id="receiveResult"></div>
</div>
</div>

<div class="tab-content" id="tab-issue">
<div class="card">
<h2>📤 出貨登錄（FIFO 自動扣帳）</h2>
<div class="row">
<div><label>SKU 編號</label><input id="issueSkuNo" value="1" type="number"></div>
<div><label>出貨量 (g)</label><input id="issueQty" value="200" type="number"></div>
<div><label>售價 (NT$/100g)</label><input id="issuePrice" value="280" type="number"></div>
<div><label>通路</label><select id="issueChannel"><option>零售</option><option>B2B</option><option>EC</option></select></div>
</div>
<button onclick="issueStock()" id="issueBtn">✅ 確認出貨</button>
<div id="issueResult"></div>
</div>
</div>

<div class="tab-content" id="tab-reports">
<div class="card">
<h2>📊 報表輸出</h2>
<div class="stat-grid">
<div class="stat-card"><div class="stat-value" id="statTotalSKU">-</div><div class="stat-label">總 SKU 數</div></div>
<div class="stat-card"><div class="stat-value" id="statTotalQty">-</div><div class="stat-label">總庫存量 (g)</div></div>
<div class="stat-card"><div class="stat-value" id="statTotalBatch">-</div><div class="stat-label">總批次數</div></div>
<div class="stat-card"><div class="stat-value" id="statTotalTrans">-</div><div class="stat-label">總交易筆數</div></div>
</div>
<div style="margin-top:16px;">
<button onclick="exportReport('inventory')">📥 匯出庫存報表 (CSV)</button>
<button onclick="exportReport('transactions')">📥 匯出交易報表 (CSV)</button>
</div>
<div id="reportResult"></div>
</div>
</div>

</div>
</div>

<script>
const API_BASE = "https://fifo-zpli.onrender.com";
let accessToken = null;
let currentUser = null;

function switchTab(tabName) {
document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
document.querySelector('.nav-tab[onclick="switchTab(\'' + tabName + '\')"]').classList.add('active');
document.getElementById('tab-' + tabName).classList.add('active');
if (tabName === 'inventory') loadInventory();
else if (tabName === 'reports') loadStats();
}

async function login() {
const username = document.getElementById("username").value.trim();
const password = document.getElementById("password").value;
const statusEl = document.getElementById("loginStatus");
const btn = document.getElementById("loginBtn");

if (!username || !password) {
statusEl.innerHTML = '<span class="status-error">請輸入帳號和密碼</span>';
return;
}

btn.disabled = true;
btn.innerHTML = '登入中...';
statusEl.innerHTML = '<span class="status-info">連線中，若伺服器剛啟動請稍候...</span>';

try {
// 修正：使用 Query 參數格式，不是 URLSearchParams
const loginUrl = API_BASE + '/auth/login?username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password);
const res = await fetch(loginUrl, { 
method: "POST",
mode: 'cors',
credentials: 'include'
});

if (!res.ok) {
const errData = await res.json().catch(() => ({ detail: res.statusText }));
throw new Error('登入失敗：' + res.status + ' ' + JSON.stringify(errData));
}

const data = await res.json();
accessToken = data.access_token;
currentUser = data;

statusEl.innerHTML = '<span class="status-success">✅ 登入成功！角色：' + data.role + '，門店：' + data.store_id + '</span>';
btn.innerHTML = '✅ 登入成功';

document.getElementById("loginCard").style.display = "none";
document.getElementById("mainApp").style.display = "block";

setTimeout(loadInventory, 500);

} catch (err) {
statusEl.innerHTML = '<span class="status-error">❌ ' + err.message + '</span>';
btn.disabled = false;
btn.innerHTML = '登入系統';
}
}

function authHeaders() {
return { 
"Authorization": "Bearer " + accessToken, 
"Content-Type": "application/json",
"Accept": "application/json"
};
}

async function loadInventory() {
const statusEl = document.getElementById("inventoryStatus");
const btn = document.getElementById("loadInvBtn");
const tbody = document.querySelector("#inventoryTable tbody");

btn.disabled = true;
btn.innerHTML = '🔄 載入中...';
statusEl.textContent = "載入中...";

try {
const res = await fetch(API_BASE + '/inventory?store_id=' + currentUser.store_id, { 
headers: authHeaders(),
mode: 'cors',
credentials: 'include'
});

if (!res.ok) throw new Error('載入失敗：' + res.status);

const data = await res.json();
tbody.innerHTML = "";

if (data.length === 0) {
tbody.innerHTML = '<tr><td colspan="6">目前無庫存資料</td></tr>';
} else {
data.forEach(p => {
const tr = document.createElement("tr");
const statusBadge = p.total_qty_g > 0 
? '<span class="badge badge-success">有庫存</span>' 
: '<span class="badge badge-warning">缺貨</span>';
tr.innerHTML = '<td>' + p.sku_no + '</td><td>' + p.name + '</td><td>' + p.total_qty_g + '</td><td>' + p.batch_count + '</td><td>' + (p.oldest_batch_age_days || "-") + '</td><td>' + statusBadge + '</td>';
tbody.appendChild(tr);
});
}

statusEl.textContent = "✅ 已載入 " + data.length + " 筆 SKU 資料";

} catch (err) {
statusEl.textContent = "❌ " + err.message;
} finally {
btn.disabled = false;
btn.innerHTML = '🔄 重新整理庫存';
}
}
