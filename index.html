<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>A.O.M Cafe 進銷存</title>
<style>
body{font-family:Arial,sans-serif;background:#F3EFE3;color:#0B2E21;margin:0;padding:0}
header{background:#0B2E21;color:#F3EFE3;padding:16px 24px}
header h1{margin:0;font-size:20px}
.container{max-width:1000px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid #C5A047;border-radius:6px;padding:16px;margin-bottom:16px}
.card h2{margin-top:0;color:#0B2E21;font-size:16px;border-bottom:2px solid #C5A047;padding-bottom:8px}
label{display:block;margin:8px 0 4px;font-size:13px;font-weight:bold}
input,select{width:100%;padding:8px;box-sizing:border-box;border:1px solid #ccc;border-radius:4px;font-size:14px}
button{background:#0B2E21;color:#C5A047;border:none;padding:10px 20px;border-radius:4px;cursor:pointer;margin-top:10px;font-weight:bold;font-size:14px}
button:hover{background:#1D4D3A}
button:disabled{background:#ccc;cursor:not-allowed}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#0B2E21;color:#C5A047}
tr:nth-child(even){background:#F3EFE3}
#loginStatus{font-size:13px;margin-top:8px}
.status-success{color:#2E7D32}
.status-error{color:#C62828}
.status-info{color:#1565C0}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:200px}
.note{font-size:12px;color:#6B4A2E;margin-top:8px}
.nav-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.nav-tab{padding:8px 16px;background:#fff;border:1px solid #C5A047;border-radius:4px 4px 0 0;cursor:pointer;font-weight:bold}
.nav-tab.active{background:#0B2E21;color:#C5A047}
.tab-content{display:none}
.tab-content.active{display:block}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:bold}
.badge-success{background:#4CAF50;color:#fff}
.badge-warning{background:#FF9800;color:#fff}
.alert{padding:12px;border-radius:4px;margin-bottom:12px}
.alert-info{background:#E3F2FD;border:1px solid #2196F3;color:#1565C0}
.alert-success{background:#E8F5E9;border:1px solid #4CAF50;color:#2E7D32}
.alert-error{background:#FFEBEE;border:1px solid #F44336;color:#C62828}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.stat-card{background:#fff;border:1px solid #C5A047;border-radius:6px;padding:16px;text-align:center}
.stat-value{font-size:28px;font-weight:bold;color:#0B2E21}
.stat-label{font-size:13px;color:#666;margin-top:4px}
pre{background:#f5f5f5;padding:8px;border-radius:4px;overflow-x:auto;font-size:11px}
</style>
</head>
<body>
<header><h1>A.O.M Cafe 進銷存系統</h1></header>
<div class="container">
<div class="card" id="loginCard">
<h2>系統登入</h2>
<div class="row">
<div><label>帳號</label><input id="username" placeholder="帳號"></div>
<div><label>密碼</label><input id="password" type="password" placeholder="密碼"></div>
</div>
<button onclick="doLogin()" id="loginBtn">登入</button>
<div id="loginStatus"></div>
<p class="note">帳號：admin / 密碼：admin123</p>
</div>
<div id="mainApp" style="display:none;">
<div class="nav-tabs">
<div class="nav-tab active" onclick="showTab('inventory')">庫存</div>
<div class="nav-tab" onclick="showTab('receive')">進貨</div>
<div class="nav-tab" onclick="showTab('issue')">出貨</div>
<div class="nav-tab" onclick="showTab('reports')">報表</div>
</div>
<div class="tab-content active" id="tab-inventory">
<div class="card">
<h2>庫存查詢</h2>
<div class="alert alert-info" id="inventoryStatus">載入中...</div>
<button onclick="loadInventory()">重新整理</button>
<table id="inventoryTable"><thead><tr><th>SKU</th><th>品名</th><th>庫存量</th><th>批次數</th><th>狀態</th></tr></thead><tbody></tbody></table>
</div>
</div>
<div class="tab-content" id="tab-receive">
<div class="card">
<h2>進貨登錄</h2>
<div class="row">
<div><label>SKU</label><input id="receiveSkuNo" value="1" type="number"></div>
<div><label>數量 (g)</label><input id="receiveQty" value="1000" type="number"></div>
<div><label>成本</label><input id="receiveCost" value="200" type="number"></div>
<div><label>供應商</label><input id="receiveSupplier" value="supplier"></div>
</div>
<button onclick="doReceive()">進貨</button>
<div id="receiveResult"></div>
</div>
</div>
<div class="tab-content" id="tab-issue">
<div class="card">
<h2>出貨登錄</h2>
<div class="row">
<div><label>SKU</label><input id="issueSkuNo" value="1" type="number"></div>
<div><label>數量 (g)</label><input id="issueQty" value="200" type="number"></div>
<div><label>售價</label><input id="issuePrice" value="280" type="number"></div>
<div><label>通路</label><select id="issueChannel"><option>零售</option><option>B2B</option><option>EC</option></select></div>
</div>
<button onclick="doIssue()">出貨</button>
<div id="issueResult"></div>
</div>
</div>
<div class="tab-content" id="tab-reports">
<div class="card">
<h2>報表輸出</h2>
<div class="stat-grid">
<div class="stat-card"><div class="stat-value" id="statTotalSKU">-</div><div class="stat-label">總SKU數</div></div>
<div class="stat-card"><div class="stat-value" id="statTotalQty">-</div><div class="stat-label">總庫存量</div></div>
<div class="stat-card"><div class="stat-value" id="statTotalBatch">-</div><div class="stat-label">總批次數</div></div>
<div class="stat-card"><div class="stat-value" id="statTotalTrans">-</div><div class="stat-label">總交易筆數</div></div>
</div>
<div style="margin-top:16px;">
<button onclick="exportReport('inventory')">匯出庫存報表</button>
<button onclick="exportReport('transactions')">匯出交易報表</button>
</div>
<div id="reportResult"></div>
</div>
</div>
</div>
</div>
<script>
var API = "https://fifo-zpli.onrender.com";
var token = null;
var user = null;

function showTab(name) {
document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('active');});
document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active');});
document.getElementById('tab-'+name).classList.add('active');
if(name==='inventory')loadInventory();
else if(name==='reports')loadStats();
}

function doLogin() {
var u = document.getElementById("username").value.trim();
var p = document.getElementById("password").value;
var el = document.getElementById("loginStatus");
var btn = document.getElementById("loginBtn");
if(!u||!p){el.innerHTML='<span class="status-error">請輸入帳密</span>';return;}
btn.disabled=true;btn.innerHTML='登入中...';
el.innerHTML='<span class="status-info">連線中...</span>';
var url = API+'/auth/login?username='+encodeURIComponent(u)+'&password='+encodeURIComponent(p);
fetch(url,{method:"POST",mode:'cors'}).then(function(r){
if(!r.ok)return r.json().then(function(e){throw new Error('登入失敗:'+r.status+' '+JSON.stringify(e));});
return r.json();
}).then(function(d){
token=d.access_token;user=d;
el.innerHTML='<span class="status-success">登入成功！門店:'+d.store_id+'</span>';
btn.innerHTML='登入成功';
document.getElementById("loginCard").style.display="none";
document.getElementById("mainApp").style.display="block";
loadInventory();
}).catch(function(e){
el.innerHTML='<span class="status-error">'+e.message+'</span>';
btn.disabled=false;btn.innerHTML='登入';
});
}

function hdrs(){return{"Authorization":"Bearer "+token,"Content-Type":"application/json"};}

function loadInventory() {
var el=document.getElementById("inventoryStatus");
var tb=document.querySelector("#inventoryTable tbody");
el.textContent="載入中...";
fetch(API+'/inventory?store_id='+user.store_id,{headers:hdrs(),mode:'cors'}).then(function(r){return r.json();}).then(function(d){
tb.innerHTML="";
if(d.length===0){tb.innerHTML='<tr><td colspan="5">無資料</td></tr>';}
else{d.forEach(function(p){
var tr=document.createElement("tr");
var b=p.total_qty_g>0?'<span class="badge badge-success">有庫存</span>':'<span class="badge badge-warning">缺貨</span>';
tr.innerHTML='<td>'+p.sku_no+'</td><td>'+p.name+'</td><td>'+p.total_qty_g+'</td><td>'+p.batch_count+'</td><td>'+b+'</td>';
tb.appendChild(tr);
});}
el.textContent="已載入"+d.length+"筆";
}).catch(function(e){el.textContent=e.message;});
}

// 進貨：JSON Body 欄位名稱必須與後端 ReceiveRequest 完全一致
// sku_no, qty_g, cost_per_100g, supplier
function doReceive() {
var el=document.getElementById("receiveResult");
var payload={
"sku_no": Number(document.getElementById("receiveSkuNo").value),
"qty_g": Number(document.getElementById("receiveQty").value),
"cost_per_100g": Number(document.getElementById("receiveCost").value),
"supplier": document.getElementById("receiveSupplier").value.trim()
};
el.innerHTML='<div class="alert alert-info">處理中...</div>';
fetch(API+'/transactions/receive',{method:"POST",headers:hdrs(),body:JSON.stringify(payload),mode:'cors'}).then(function(r){
if(!r.ok)return r.json().then(function(e){throw new Error('失敗:'+r.status+' '+JSON.stringify(e));});
return r.json();
}).then(function(d){
el.innerHTML='<div class="alert alert-success">成功！</div><pre>'+JSON.stringify(d,null,2)+'</pre>';
setTimeout(function(){showTab('inventory');},1500);
}).catch(function(e){el.innerHTML='<div class="alert alert-error">'+e.message+'</div>';});
}

// 出貨：JSON Body 欄位名稱必須與後端 IssueRequest 完全一致
// sku_no, qty_g, sell_price_ntd_per_100g, channel
function doIssue() {
var el=document.getElementById("issueResult");
var payload={
"sku_no": Number(document.getElementById("issueSkuNo").value),
"qty_g": Number(document.getElementById("issueQty").value),
"sell_price_ntd_per_100g": Number(document.getElementById("issuePrice").value),
"channel": document.getElementById("issueChannel").value
};
el.innerHTML='<div class="alert alert-info">處理中...</div>';
fetch(API+'/transactions/issue',{method:"POST",headers:hdrs(),body:JSON.stringify(payload),mode:'cors'}).then(function(r){
if(!r.ok)return r.json().then(function(e){throw new Error('失敗:'+r.status+' '+JSON.stringify(e));});
return r.json();
}).then(function(d){
el.innerHTML='<div class="alert alert-success">成功！</div><pre>'+JSON.stringify(d,null,2)+'</pre>';
setTimeout(function(){showTab('inventory');},1500);
}).catch(function(e){el.innerHTML='<div class="alert alert-error">'+e.message+'</div>';});
}

function loadStats() {
fetch(API+'/inventory?store_id='+user.store_id,{headers:hdrs(),mode:'cors'}).then(function(r){return r.json();}).then(function(invData){
document.getElementById("statTotalSKU").textContent=invData.length;
var totalQty=0,totalBatch=0;
invData.forEach(function(p){totalQty+=p.total_qty_g;totalBatch+=p.batch_count;});
document.getElementById("statTotalQty").textContent=totalQty;
document.getElementById("statTotalBatch").textContent=totalBatch;
fetch(API+'/transactions?store_id='+user.store_id,{headers:hdrs(),mode:'cors'}).then(function(r){return r.json();}).then(function(transData){
document.getElementById("statTotalTrans").textContent=transData.length;
});
});
}

function exportReport(type) {
var el=document.getElementById("reportResult");
el.innerHTML='<div class="alert alert-info">產生報表中...</div>';
fetch(API+'/reports/'+type+'?store_id='+user.store_id,{headers:hdrs(),mode:'cors'}).then(function(r){return r.blob();}).then(function(blob){
var url=window.URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;a.download=type+'_report.csv';
document.body.appendChild(a);a.click();document.body.removeChild(a);
window.URL.revokeObjectURL(url);
el.innerHTML='<div class="alert alert-success">報表已下載</div>';
}).catch(function(e){el.innerHTML='<div class="alert alert-error">'+e.message+'</div>';});
}
</script>
</body>
</html>
